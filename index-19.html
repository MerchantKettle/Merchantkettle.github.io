<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Differential Calculus Rules</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-hover: #1c2128;
      --border: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --accent: #58a6ff;
      --accent-dim: rgba(88, 166, 255, 0.15);
      --success: #3fb950;
      --success-dim: rgba(63, 185, 80, 0.15);
      --danger: #f85149;
      --danger-dim: rgba(248, 81, 73, 0.15);
      --amber: #d29922;
      --amber-dim: rgba(210, 153, 34, 0.15);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    sup {
      font-size: 0.68em;
      line-height: 0;
      position: relative;
      top: -0.5em;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-secondary);
      font-size: 16px;
    }

    .subject-intro {
      margin-top: 18px;
      padding: 16px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 15px;
    }

    .references-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-top: 20px;
    }

    .references-card summary {
      cursor: pointer;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 600;
      list-style: none;
    }

    .references-card summary::-webkit-details-marker { display: none; }

    .references-card summary::before {
      content: "▸ ";
      color: var(--accent);
    }

    .references-card[open] summary::before {
      content: "▾ ";
    }

    .ref-row {
      display: flex;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .ref-row:last-child { border-bottom: none; }

    .ref-code {
      flex-shrink: 0;
      width: 56px;
      font-family: var(--font-mono);
      color: var(--accent);
      font-size: 12px;
    }

    .ref-row a { color: var(--accent); }

    .subject-switcher {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .subject-btn {
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .subject-btn:hover {
      border-color: var(--text-muted);
      color: var(--text-primary);
    }

    .subject-btn.active {
      background: var(--text-primary);
      color: var(--bg);
      border-color: var(--text-primary);
    }

    .tabs {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 24px 0;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .tab-group-label {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .tab-group-intro {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      max-width: 68ch;
    }

    .tab-group-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      position: relative;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
      border-color: var(--text-muted);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 500;
    }

    .tab-btn.done::after {
      content: "✓";
      margin-left: 6px;
      color: var(--success);
      font-weight: 700;
    }

    .tab-btn.active.done::after {
      color: #fff;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .formula-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      margin: 12px 0;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 20px;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .description {
      color: var(--text-secondary);
      font-size: 15px;
      margin-top: 8px;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .step:last-child { border-bottom: none; }

    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent-dim);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .step-body {
      flex: 1;
      font-size: 15px;
      color: var(--text-secondary);
    }

    .step-body strong {
      color: var(--text-primary);
      font-weight: 500;
    }

    .example-func {
      font-size: 22px;
      text-align: center;
      margin: 8px 0 16px;
      color: var(--text-primary);
      font-family: var(--font-mono);
    }

    .reveal-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 8px 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .reveal-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .hidden { display: none !important; }

    .practice-count {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      margin-top: -6px;
      margin-bottom: 12px;
    }

    .practice-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 16px;
      margin-top: 10px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .practice-input:focus { border-color: var(--accent); }

    .practice-input::placeholder { color: var(--text-muted); }

    .btn-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .check-btn, .next-btn {
      padding: 8px 18px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      transition: opacity 0.15s ease;
    }

    .next-btn {
      background: var(--success);
    }

    .check-btn:hover, .next-btn:hover { opacity: 0.85; }

    .check-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .hint-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      padding: 0;
    }

    .hint-btn:hover { color: var(--text-secondary); }

    .hint-text {
      margin-top: 10px;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 14px;
      color: var(--text-secondary);
      display: none;
    }

    .feedback {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      background: var(--success-dim);
      color: var(--success);
      display: block;
    }

    .feedback.wrong {
      background: var(--danger-dim);
      color: var(--danger);
      display: block;
    }

    .feedback.done {
      background: var(--accent-dim);
      color: var(--accent);
      display: block;
    }

    .error-msg {
      padding: 16px;
      background: var(--danger-dim);
      color: var(--danger);
      border-radius: var(--radius-md);
      text-align: center;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      .container { padding: 20px 16px; }
      header h1 { font-size: 24px; }
      .formula-box { font-size: 16px; padding: 16px; }
      .example-func { font-size: 18px; }
      .card { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Engineering Course Companion</h1>
      <p>Learn, practice, and master your course topics</p>
    </header>

    <div class="subject-switcher" id="subject-switcher"></div>
    <div class="subject-intro" id="subject-intro"></div>
    <nav class="tabs" id="tab-bar"></nav>
    <main id="content-area"></main>
    <div id="references-section"></div>

    <footer>
      Built for GitHub Pages &middot; No external dependencies
    </footer>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      try {
        initApp();
      } catch (e) {
        console.error(e);
        document.getElementById("content-area").innerHTML =
          '<div class="card"><div class="error-msg">Something went wrong loading the content. Please try refreshing the page.</div></div>';
      }
    });

    function initApp() {
      var rules = {
        limits: {
          name: "Limits",
          category: "Limits & Continuity",
          subject: "calculus",
          formula: "lim [f(x) &plusmn; g(x)] = lim f(x) &plusmn; lim g(x)<br>lim [f(x) &middot; g(x)] = lim f(x) &middot; lim g(x)<br>lim [f(x) / g(x)] = lim f(x) / lim g(x)<br>lim [sin(x)/x] = 1&nbsp;&nbsp;(as x &rarr; 0)",
          desc: "A limit describes the value a function approaches as x gets closer and closer to some number — without necessarily ever reaching it. The theorems above let you break a complicated limit into simpler pieces: the limit of a sum, product, or quotient is the sum, product, or quotient of the individual limits (as long as you don't divide by a limit of zero).",
          whenToUse: "Start every limit problem with direct substitution. If that gives a real number, you're done. If it gives an indeterminate form like 0/0 or &infin;/&infin;, factor and cancel, or apply L'H&ocirc;pital's Rule: differentiate the top and bottom separately, then try the limit again. For limits at infinity of a ratio of polynomials, compare the degree of the top and bottom instead of substituting directly.",
          steps: [
            { text: "Try <strong>direct substitution</strong> first — plug the value x is approaching straight into the function." },
            { text: "If you get 0/0 or &infin;/&infin;, the limit is <strong>indeterminate</strong>. Try factoring and canceling common terms, or rationalizing." },
            { text: "Still stuck? Apply <strong>L'H&ocirc;pital's Rule</strong>: take the derivative of the top and the derivative of the bottom separately, then evaluate the new limit." },
            { text: "For rational functions as x &rarr; &infin;, compare degrees: top's degree higher &rarr; limit is &infin;; bottom's degree higher &rarr; limit is 0; equal degrees &rarr; limit is the ratio of the leading coefficients." }
          ],
          example: { f: "Evaluate lim (x^2-1)/(x-1) as x &rarr; 1", steps: [
            "Direct substitution gives (1-1)/(1-1) = 0/0 — indeterminate, so factor first",
            "x^2 - 1 factors as (x-1)(x+1)",
            "Cancel the common (x-1) factor: (x-1)(x+1)/(x-1) = x+1",
            "Now substitute x = 1: 1 + 1 = 2",
            "Therefore, the limit is 2"
          ]},
          practice: [
            { q: "Evaluate lim (x+4)/(x-4) as x &rarr; &infin;", a: ["1"], hint: "Divide every term by the highest power of x (here, x^1). The constants +4 and -4 shrink to 0 as x&rarr;&infin;, leaving x/x." },
            { q: "Evaluate lim (x^2-4)/(x-2) as x &rarr; 2", a: ["4"], hint: "Direct substitution gives 0/0. Factor x^2-4 as (x-2)(x+2), cancel the (x-2), then substitute x=2." },
            { q: "Evaluate lim (3x^4-2x^2+7)/(5x^3+x-3) as x &rarr; &infin;", a: ["infinity", "inf", "undefined", "does not exist", "dne"], hint: "Compare degrees: the top is degree 4, the bottom is degree 3. When the top's degree is higher, the ratio grows without bound." },
            { q: "Evaluate lim sin(3x)/x as x &rarr; 0", a: ["3"], hint: "Rewrite as 3 &middot; [sin(3x)/(3x)]. As x&rarr;0, 3x&rarr;0 too, so sin(3x)/(3x) &rarr; 1, leaving just 3." }
          ]
        },
        derivation: {
          name: "Derivative Definition",
          category: "Derivative Basics",
          subject: "calculus",
          formula: "f'(x) = lim [f(x+h) - f(x)] / h&nbsp;&nbsp;(as h &rarr; 0)",
          desc: "This is the formal definition of the derivative — every shortcut rule on this page (power rule, product rule, chain rule, all of them) is really just a proven consequence of this one limit. It measures the slope of the secant line through two nearby points on a curve, then squeezes those points together until the secant becomes the tangent line.",
          whenToUse: "You won't reach for this in everyday differentiation — the shortcut rules are much faster. But some exam questions specifically ask you to differentiate 'from first principles' or 'using the definition,' which means the power rule isn't an acceptable shortcut — you have to work through this limit by hand.",
          steps: [
            { text: "Write <strong>f(x+h)</strong> by substituting (x+h) everywhere x appears in f(x)." },
            { text: "Form the difference quotient <strong>[f(x+h) - f(x)] / h</strong>, then expand and simplify the numerator." },
            { text: "Factor an <strong>h</strong> out of the numerator and cancel it with the h in the denominator." },
            { text: "Take the limit as <strong>h &rarr; 0</strong> — any remaining h terms vanish, leaving f'(x)." }
          ],
          example: { f: "Derive f'(x) for f(x) = x^2 using the definition", steps: [
            "f(x+h) = (x+h)^2 = x^2 + 2xh + h^2",
            "f(x+h) - f(x) = (x^2 + 2xh + h^2) - x^2 = 2xh + h^2",
            "Divide by h: (2xh + h^2)/h = 2x + h",
            "Take the limit as h &rarr; 0: 2x + 0 = 2x",
            "Therefore, f'(x) = 2x — exactly what the power rule predicts"
          ]},
          practice: [
            { q: "Use the definition of the derivative to find f'(x) for f(x) = 3x + 5", a: ["3"], hint: "f(x+h) = 3(x+h)+5 = 3x+3h+5. Subtract f(x), divide by h — the h's cancel completely before you even take the limit." },
            { q: "Use the definition of the derivative to find f'(x) for f(x) = x^2 + 4x", a: ["2x+4", "2x + 4"], hint: "Expand f(x+h) = (x+h)^2 + 4(x+h), subtract f(x), divide by h, simplify, then let h&rarr;0." },
            { q: "Use the definition of the derivative to find f'(x) for f(x) = x^3", a: ["3x^2", "3*x^2"], hint: "Expand (x+h)^3 = x^3+3x^2h+3xh^2+h^3. Subtract x^3, divide by h, then take the limit as h&rarr;0." },
            { q: "Use the definition of the derivative to find f'(x) for f(x) = 1/x", a: ["-1/x^2", "-1x^-2"], hint: "Combine f(x+h)-f(x) = 1/(x+h) - 1/x into a single fraction: -h / [x(x+h)]. Then divide by h and take the limit." }
          ]
        },
        power: {
          name: "Power rule",
          category: "Derivative Basics",
          subject: "calculus",
          formula: "d/dx [x^n] = n * x^(n-1)",
          desc: "When differentiating x raised to a power n, bring the exponent down as a coefficient and subtract 1 from the exponent.",
          whenToUse: "Use this any time a single variable is raised to a numeric power — plain polynomial terms, roots written as fractional powers (√x = x^(1/2)), and reciprocals written as negative powers (1/x = x^(-1)) all reduce to this rule.",
          steps: [
            { text: "Identify the exponent <strong>n</strong> on the variable x." },
            { text: "Multiply the term by <strong>n</strong> (bring the exponent to the front)." },
            { text: "Decrease the exponent by <strong>1</strong>." }
          ],
          example: { f: "f(x) = x^5", steps: [
            "The exponent is n = 5",
            "Bring 5 to the front: 5 * x^5",
            "Subtract 1 from the exponent: 5 * x^4",
            "Therefore, f'(x) = 5x^4"
          ]},
          practice: [
            { q: "Differentiate f(x) = x^7", a: ["7x^6", "7*x^6", "7x6"], hint: "Bring the 7 down and subtract 1 from the exponent." },
            { q: "Differentiate f(x) = x^10", a: ["10x^9", "10*x^9", "10x9"], hint: "Same idea, just a bigger exponent: n=10." },
            { q: "Differentiate f(x) = x^(-2)", a: ["-2x^-3", "-2*x^-3", "-2/x^3", "-2x-3"], hint: "The power rule works on negative exponents too: bring -2 down, subtract 1 to get -3." },
            { q: "Differentiate f(x) = √x  (write as x^(1/2))", a: ["1/2x^-1/2", "0.5x^-0.5", "x^-1/2/2", "1/(2√x)", "1/(2sqrt(x))"], hint: "√x = x^(1/2). Bring 1/2 down, subtract 1 from the exponent to get -1/2." }
          ]
        },
        constant: {
          name: "Constant rule",
          category: "Derivative Basics",
          subject: "calculus",
          formula: "d/dx [c] = 0",
          desc: "The derivative of any constant is zero. Constants don't change, so their rate of change is zero.",
          whenToUse: "Use whenever a term has no variable attached at all — plain numbers, y-intercepts, offset terms, or named constants like π and e sitting by themselves.",
          steps: [
            { text: "Recognize that the term is a constant (no x variable)." },
            { text: "The derivative of any constant is <strong>0</strong>." }
          ],
          example: { f: "f(x) = 12", steps: [
            "12 is a constant - it has no x variable",
            "The derivative of a constant is always 0",
            "Therefore, f'(x) = 0"
          ]},
          practice: [
            { q: "Differentiate f(x) = -3", a: ["0"], hint: "There is no x variable, so the rate of change is zero." },
            { q: "Differentiate f(x) = 100", a: ["0"], hint: "Still just a number — no x means no change." },
            { q: "Differentiate f(x) = π", a: ["0"], hint: "π is a fixed number (≈3.14159), so it's a constant too." },
            { q: "Differentiate f(x) = e  (Euler's number, standing alone)", a: ["0"], hint: "e ≈ 2.71828 is a constant here — it's not e^x. Don't confuse it with the exponential function." }
          ]
        },
        constant_multiple: {
          name: "Constant multiple",
          category: "Derivative Basics",
          subject: "calculus",
          formula: "d/dx [c * f(x)] = c * f'(x)",
          desc: "A constant coefficient stays unchanged while you differentiate the function it multiplies.",
          whenToUse: "Use any time a plain number multiplies a function — a coefficient in front of a polynomial, trig, or exponential term. Pull the constant out front, differentiate what remains, then multiply back in.",
          steps: [
            { text: "Identify the constant coefficient <strong>c</strong>." },
            { text: "Differentiate the function <strong>f(x)</strong> as usual." },
            { text: "Multiply the result by <strong>c</strong>." }
          ],
          example: { f: "f(x) = 4x^3", steps: [
            "The constant coefficient is c = 4",
            "Differentiate x^3 using the power rule: 3x^2",
            "Multiply by 4: 4 * 3x^2 = 12x^2",
            "Therefore, f'(x) = 12x^2"
          ]},
          practice: [
            { q: "Differentiate f(x) = 5x^4", a: ["20x^3", "20*x^3", "20x3"], hint: "Keep the 5, differentiate x^4 to get 4x^3, then multiply: 5 × 4x^3." },
            { q: "Differentiate f(x) = -3x^6", a: ["-18x^5", "-18*x^5", "-18x5"], hint: "Differentiate x^6 to get 6x^5, then multiply by -3." },
            { q: "Differentiate f(x) = 7√x  (write as 7x^(1/2))", a: ["3.5x^-1/2", "7/2x^-1/2", "3.5/√x", "3.5/sqrt(x)"], hint: "Differentiate x^(1/2) to get (1/2)x^(-1/2), then multiply by 7." },
            { q: "Differentiate f(x) = (2/3)x^9", a: ["6x^8", "6*x^8", "6x8"], hint: "Differentiate x^9 to get 9x^8, then multiply by 2/3: (2/3)×9 = 6." }
          ]
        },
        sum: {
          name: "Sum & difference",
          category: "Derivative Basics",
          subject: "calculus",
          formula: "d/dx [f(x) +/- g(x)] = f'(x) +/- g'(x)",
          desc: "The derivative of a sum or difference is the sum or difference of the derivatives. Differentiate each term separately.",
          whenToUse: "Use whenever an expression is built out of separate terms added or subtracted — most polynomials and mixed expressions. Split it apart, differentiate term by term, then recombine with the same signs.",
          steps: [
            { text: "Break the expression into individual terms." },
            { text: "Differentiate each term separately using the appropriate rule." },
            { text: "Combine the results with the same signs (+ or -)." }
          ],
          example: { f: "f(x) = 3x^2 + 5x - 7", steps: [
            "Break into terms: 3x^2, 5x, and -7",
            "d/dx[3x^2] = 3 * 2x = 6x",
            "d/dx[5x] = 5 * 1 = 5",

          ]},
          practice: [
            { q: "A fuel has HHV = 50,000 kJ/kg and produces 0.5 kg H2O per kg fuel. Find its LHV. (latent heat = 2440 kJ/kg)", a: ["48780"], hint: "Heat lost to vapor = 0.5 &times; 2440 = 1220. Subtract from HHV: 50000-1220." },
            { q: "Which heating value accounts for the heat recovered by condensing water vapor: HHV or LHV?", a: ["hhv", "higher heating value"], hint: "The one with 'higher' in the name includes more heat recovery, since condensing water releases additional heat." }
          ]
        },
        combustion: {
          name: "Combustion Stoichiometry",
          category: "Fuels",
          subject: "chemistry",
          formula: "CxHy + (x + y/4) O2 &rarr; x CO2 + (y/2) H2O",
          desc: "Complete combustion of a hydrocarbon fuel consumes oxygen and produces carbon dioxide and water. Stoichiometric (theoretical) air is the exact amount of air needed for complete combustion with none left over; real combustion usually uses excess air to ensure nothing is left unburned.",
          whenToUse: "Use this to calculate how much air or oxygen a fuel needs to burn completely, or to determine the percent excess air supplied in a real combustion process — key calculations in furnace, engine, and boiler design.",
          steps: [
            { text: "Write the balanced combustion equation for the fuel, producing only CO2 and H2O." },
            { text: "Use the mole ratios from the balanced equation to find the theoretical (stoichiometric) oxygen needed." },
            { text: "Convert oxygen to air using air's approximate composition (21% O2 by volume), and account for any excess air specified." }
          ],
          example: { f: "Find the theoretical O2 needed to completely burn 1 mol of CH4 (methane)", steps: [
            "Balanced equation: CH4 + 2O2 &rarr; CO2 + 2H2O",
            "The coefficient of O2 is 2, so 1 mol of CH4 needs 2 mol of O2",
            "Therefore, 2 mol of O2 is the theoretical oxygen requirement"
          ]},
          practice: [
            { q: "Balance the combustion of propane: C3H8 + ? O2 &rarr; 3CO2 + 4H2O. Find the coefficient of O2.", a: ["5"], hint: "Use the formula (x + y/4) with x=3 carbons and y=8 hydrogens." },
            { q: "If a furnace uses 20% excess air, and the theoretical air required is 10 kg, how much air is actually supplied?", a: ["12"], hint: "Actual air = theoretical air &times; (1 + percent excess as a decimal) = 10 &times; 1.20." }
          ]
        }
      };

      var currentSubject = "calculus";
      var currentKey = "limits";
      var tabBar = document.getElementById("tab-bar");
      var subjectSwitcher = document.getElementById("subject-switcher");
      var contentArea = document.getElementById("content-area");

      var subjectLabels = { calculus: "Differential Calculus", chemistry: "Chemistry for Engineers" };

      var subjectIntros = {
        calculus: "Differential calculus is the branch of mathematics that deals with derivatives and limits — how quantities change from one instant to the next. It's the foundation for analyzing rates, slopes, and optimization, and it underpins nearly every quantitative engineering course that follows.",
        chemistry: "Chemistry for Engineers applies core chemical principles to problems engineers actually run into: electrochemical cells for power generation and corrosion protection, nuclear processes for energy and material analysis, and the fuels that drive combustion systems. The focus is on understanding the chemistry behind the equipment and processes you'll design, operate, and evaluate — not memorizing reactions for their own sake."
      };

      var subjectReferences = {
        chemistry: [
          { code: "Ref01", text: "Cede&ntilde;o, K. (unpublished). Chemistry for Engineers Module (unpublished)." },
          { code: "Ref02", text: "Brown, L. and Holme, T. (2012). Chemistry for Engineering, 2nd Edition. Cengage Learning Asia Pte Ltd, Singapore." },
          { code: "Ref03", text: "Silberberg, M.S. (2013). Principles of General Chemistry, 3rd Edition. McGraw Hill International Edition." },
          { code: "Ref04", text: "Whitten, K.W., Davis, R.E., Peck, M.L., Stanley, G.G. (2005). General Chemistry, 7th Edition. Thomson Asia Pte Ltd." },
          { code: "Ref05", text: "Callister, W.D., Rethwisch, D.G. (2011). Materials Science and Engineering, 8th Edition. John Wiley &amp; Sons (Asia) Pte Ltd." },
          { code: "Ref06", text: "Mukhopadhyay, R., Datta, S. (2007). Engineering Chemistry. New Age International (P) Ltd., New Delhi." },
          { code: "Ref07", text: "American Chemical Society (2017). Safety in Academic Chemistry Laboratories, 8th ed. Washington DC." },
          { code: "Ref08", text: "American Chemical Society / UNT Risk Management Services (2020, July 17). HCS and GHS Training Module 2. Retrieved from riskmanagement.unt.edu/hcs-ghs-module2." },
          { code: "Ref09", text: "Philippine Clean Air Act, DENR Administrative Order (DAO 2016-08)." },
          { code: "Ref10", text: "World Health Organization guidelines." },
          { code: "Ref11", text: "US Environmental Protection Agency. <a href=\"https://www.epa.gov\" target=\"_blank\" rel=\"noopener\">epa.gov</a>" }
        ]
      };

      var categoryIntros = {
        "Electrochemistry": "Electrochemistry studies the relationship between chemical reactions and electricity — redox reactions that either generate electrical energy (as in batteries) or are driven by it (as in electroplating). It's the chemistry behind everything from AA batteries to corrosion protection to industrial metal refining.",
        "Nuclear Chemistry": "Nuclear chemistry studies changes happening inside the nucleus of an atom, rather than around it — reactions that transform one element into another rather than just rearranging electrons. It covers radioactive decay, half-lives, and the energy released when nuclei split apart (fission) or combine (fusion), the basis of nuclear power and nuclear medicine.",
        "Fuels": "This section covers how fuels store and release energy through combustion — classifying fuels by state and origin, measuring how much heat they release (heating value), and calculating the exact amount of air a fuel needs to burn completely. These calculations are central to designing engines, boilers, and furnaces."
      };
      var progress = {};
      var totalProblems = 0;
      Object.keys(rules).forEach(function(key) {
        progress[key] = { index: 0, solved: 0 };
        totalProblems += rules[key].practice.length;
      });

      function normalize(s) {
        return s.toLowerCase()
          .replace(/\s+/g, "")
          .replace(/[−–—]/g, "-")
          .replace(/[()]/g, "")
          .replace(/\*/g, "")
          .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, function(m) {
            return "⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(m);
          })
          .replace(/[₀₁₂₃₄₅₆₇₈₉]/g, function(m) {
            return "₀₁₂₃₄₅₆₇₈₉".indexOf(m);
          });
      }

      // Turns caret notation like x^2 or x^(n-1) into real superscript
      // markup, so it renders as x² instead of x^2.
      function supify(str) {
        return String(str)
          .replace(/\^\(([^)]+)\)/g, "<sup>$1</sup>")
          .replace(/\^(-?[A-Za-z0-9]+)/g, "<sup>$1</sup>");
      }

      function renderSubjectMeta() {
        var introEl = document.getElementById("subject-intro");
        introEl.textContent = subjectIntros[currentSubject] || "";

        var refsEl = document.getElementById("references-section");
        refsEl.innerHTML = "";
        var refs = subjectReferences[currentSubject];
        if (refs && refs.length) {
          var details = document.createElement("details");
          details.className = "references-card";
          var summary = document.createElement("summary");
          summary.textContent = "References";
          details.appendChild(summary);

          var list = document.createElement("div");
          list.style.marginTop = "14px";
          refs.forEach(function(r) {
            var row = document.createElement("div");
            row.className = "ref-row";
            row.innerHTML = '<div class="ref-code">' + r.code + '</div><div>' + r.text + '</div>';
            list.appendChild(row);
          });
          details.appendChild(list);
          refsEl.appendChild(details);
        }
      }

      function renderSubjectSwitcher() {
        subjectSwitcher.innerHTML = "";
        var subjectOrder = [];
        Object.keys(rules).forEach(function(key) {
          var subj = rules[key].subject || "calculus";
          if (subjectOrder.indexOf(subj) === -1) subjectOrder.push(subj);
        });

        subjectOrder.forEach(function(subj) {
          var btn = document.createElement("button");
          btn.className = "subject-btn" + (subj === currentSubject ? " active" : "");
          btn.textContent = subjectLabels[subj] || subj;
          btn.onclick = function() {
            if (subj === currentSubject) return;
            currentSubject = subj;
            // jump to the first topic in the newly selected subject
            var firstKey = Object.keys(rules).filter(function(k) {
              return (rules[k].subject || "calculus") === currentSubject;
            })[0];
            currentKey = firstKey;
            renderSubjectSwitcher();
            renderSubjectMeta();
            renderTabs();
            renderContent();
          };
          subjectSwitcher.appendChild(btn);
        });
      }

      function renderTabs() {
        tabBar.innerHTML = "";
        var keys = Object.keys(rules).filter(function(k) {
          return (rules[k].subject || "calculus") === currentSubject;
        });

        // Group keys by category, preserving first-seen order
        var categoryOrder = [];
        var byCategory = {};
        keys.forEach(function(key) {
          var cat = rules[key].category || "Other";
          if (!byCategory[cat]) {
            byCategory[cat] = [];
            categoryOrder.push(cat);
          }
          byCategory[cat].push(key);
        });

        categoryOrder.forEach(function(cat) {
          var group = document.createElement("div");
          group.className = "tab-group";

          var label = document.createElement("div");
          label.className = "tab-group-label";
          label.textContent = cat;
          group.appendChild(label);

          if (categoryIntros[cat]) {
            var catIntro = document.createElement("div");
            catIntro.className = "tab-group-intro";
            catIntro.textContent = categoryIntros[cat];
            group.appendChild(catIntro);
          }

          var row = document.createElement("div");
          row.className = "tab-group-row";

          byCategory[cat].forEach(function(key) {
            var isDone = progress[key].solved >= rules[key].practice.length;
            var btn = document.createElement("button");
            btn.className = "tab-btn" + (key === currentKey ? " active" : "") + (isDone ? " done" : "");
            btn.textContent = rules[key].name;
            btn.onclick = (function(k) {
              return function() {
                currentKey = k;
                renderTabs();
                renderContent();
              };
            })(key);
            row.appendChild(btn);
          });

          group.appendChild(row);
          tabBar.appendChild(group);
        });
      }

      function renderContent() {
        var r = rules[currentKey];
        contentArea.innerHTML = "";

        // Formula card
        var formulaCard = document.createElement("div");
        formulaCard.className = "card";
        formulaCard.innerHTML =
          '<div class="card-title">Formula</div>' +
          '<div class="formula-box">' + supify(r.formula) + '</div>' +
          '<p class="description">' + supify(r.desc) + '</p>' +
          '<p class="description" style="margin-top:10px;"><strong style="color:var(--text-primary);">When to use it:</strong> ' + supify(r.whenToUse) + '</p>';
        contentArea.appendChild(formulaCard);

        // Steps card
        var stepsCard = document.createElement("div");
        stepsCard.className = "card";
        var stepsHtml = '<div class="card-title">How to apply</div>';
        for (var i = 0; i < r.steps.length; i++) {
          stepsHtml += '<div class="step"><div class="step-num">' + (i+1) + '</div><div class="step-body">' + supify(r.steps[i].text) + '</div></div>';
        }
        stepsCard.innerHTML = stepsHtml;
        contentArea.appendChild(stepsCard);

        // Example card
        var exCard = document.createElement("div");
        exCard.className = "card";
        var exHtml = '<div class="card-title">Worked example</div><div class="example-func">' + supify(r.example.f) + '</div>';
        exHtml += '<button class="reveal-btn" id="ex-reveal">Show step-by-step solution</button>';
        exHtml += '<div id="ex-steps" class="hidden" style="margin-top:14px;">';
        for (var j = 0; j < r.example.steps.length; j++) {
          exHtml += '<div class="step"><div class="step-num">' + (j+1) + '</div><div class="step-body">' + supify(r.example.steps[j]) + '</div></div>';
        }
        exHtml += '</div>';
        exCard.innerHTML = exHtml;
        contentArea.appendChild(exCard);

        var exRevealBtn = document.getElementById("ex-reveal");
        var exSteps = document.getElementById("ex-steps");
        exRevealBtn.addEventListener("click", function() {
          exSteps.classList.toggle("hidden");
          exRevealBtn.textContent = exSteps.classList.contains("hidden")
            ? "Show step-by-step solution"
            : "Hide step-by-step solution";
        });

        // Practice card
        renderPracticeCard(r);
      }

      function renderPracticeCard(r) {
        var total = r.practice.length;
        var prog = progress[currentKey];
        var isComplete = prog.solved >= total;
        var idx = Math.min(prog.index, total - 1);
        var problem = r.practice[idx];

        var card = document.createElement("div");
        card.className = "card";

        var headerHtml =
          '<div class="card-title">Practice problem</div>' +
          '<div class="practice-count">' + (idx + 1) + ' of ' + total + (isComplete ? ' — all solved 🎉' : '') + '</div>';

        card.innerHTML = headerHtml;

        if (isComplete) {
          var doneMsg = document.createElement("div");
          doneMsg.className = "feedback done";
          doneMsg.textContent = "Nice work — you've solved every practice problem for the " + r.name.toLowerCase() + ". Pick another tab to keep going.";
          card.appendChild(doneMsg);
          contentArea.appendChild(card);
          return;
        }

        var body = document.createElement("div");
        body.style.marginTop = "14px";
        body.innerHTML =
          '<div class="example-func" style="font-size:17px;text-align:left;">' + supify(problem.q) + '</div>' +
          '<input type="text" class="practice-input" id="practice-input" placeholder="Type your answer, e.g. 5x⁴" autocomplete="off" spellcheck="false">' +
          '<div class="btn-row">' +
            '<button class="check-btn" id="check-btn">Check answer</button>' +
            '<button class="hint-btn" id="hint-btn">Need a hint?</button>' +
          '</div>' +
          '<div class="hint-text" id="hint-text">' + supify(problem.hint) + '</div>' +
          '<div class="feedback" id="practice-feedback"></div>' +
          '<div class="btn-row" id="next-row"></div>';
        card.appendChild(body);
        contentArea.appendChild(card);

        var input = document.getElementById("practice-input");
        var checkBtn = document.getElementById("check-btn");
        var hintBtn = document.getElementById("hint-btn");
        var hintText = document.getElementById("hint-text");
        var feedback = document.getElementById("practice-feedback");
        var nextRow = document.getElementById("next-row");

        hintBtn.addEventListener("click", function() {
          var showing = hintText.style.display === "block";
          hintText.style.display = showing ? "none" : "block";
          hintBtn.textContent = showing ? "Need a hint?" : "Hide hint";
        });

        function submit() {
          var raw = input.value.trim();
          if (!raw) return;
          var norm = normalize(raw);
          var acceptable = problem.a.map(normalize);
          var isCorrect = acceptable.indexOf(norm) !== -1;

          feedback.className = "feedback " + (isCorrect ? "correct" : "wrong");
          feedback.style.display = "block";

          if (isCorrect) {
            feedback.textContent = "Correct! Great job.";
            checkBtn.disabled = true;
            input.disabled = true;

            if (prog.index === idx) {
              prog.solved = Math.max(prog.solved, idx + 1);
            }
            renderTabs();

            var hasNext = idx + 1 < total;
            nextRow.innerHTML = "";
            if (hasNext) {
              var nextBtn = document.createElement("button");
              nextBtn.className = "next-btn";
              nextBtn.textContent = "Next problem →";
              nextBtn.addEventListener("click", function() {
                prog.index = idx + 1;
                renderPracticeCardRefresh(r);
              });
              nextRow.appendChild(nextBtn);
            } else {
              var doneBtn = document.createElement("div");
              doneBtn.className = "feedback done";
              doneBtn.style.marginTop = "4px";
              doneBtn.textContent = "That's the last problem for this rule — nice work!";
              nextRow.appendChild(doneBtn);
            }
          } else {
            feedback.textContent = "Not quite — check your signs and exponents, then try again.";
          }
        }

        function renderPracticeCardRefresh(r) {
          // Remove just the practice card and re-render it
          card.remove();
          renderPracticeCard(r);
        }

        checkBtn.addEventListener("click", submit);
        input.addEventListener("keydown", function(e) {
          if (e.key === "Enter") submit();
        });
      }

      renderSubjectSwitcher();
      renderSubjectMeta();
      renderTabs();
      renderContent();
    }
  </script>
</body>
</html>
